# Деплой на Render: https://render.com
# Web service: нужен публичный URL для вебхука RevenueCat (/rc/webhook).
services:
  - type: web
    name: mockuper-metrics-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: TELEGRAM_BOT_TOKEN
        sync: false # вставить в дашборде Render
      - key: TELEGRAM_CHAT_ID
        sync: false # ID чата, куда слать отчёты (команда /chatid у бота)
      - key: POSTHOG_API_KEY
        sync: false # personal API key (phx_...)
      - key: POSTHOG_PROJECT_ID
        value: "498457"
      - key: POSTHOG_HOST
        value: https://us.posthog.com
      - key: REPORT_TZ
        value: Europe/Moscow
      - key: REPORT_HOUR
        value: "9"
      - key: APP_NAME
        value: Mockup Clothing
      - key: REVENUECAT_API_KEY
        sync: false # secret API key v2 (sk_...) для денежной секции
      - key: REVENUECAT_PROJECT_ID
        sync: false # ID проекта RevenueCat (proj...)
      - key: RC_WEBHOOK_AUTH
        sync: false # секрет вебхука RC = Authorization header в RevenueCat
